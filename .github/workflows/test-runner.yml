name: Tests

on:
  # Run testing on all push and pull requests that have committed changes in PHP files
  push:
    paths:
      - '**/*.php'
  pull_request:
    paths:
      - '**/*.php'
  # Make it possible to run the workflow manually
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest

    # Define the matrix of different PHP, Laravel, and testbench versions
    strategy:
      # Fail the whole workflow if one of the jobs fails
      fail-fast: true
      matrix:
        php: [ 8.3, 8.4, 8.5 ]
        laravel: [ 11.*, 12.* ]
        dependency-version: [ prefer-stable ]
        include:
          # Laravel 12 uses Orchestra Testbench 10
          - laravel: 12.*
            testbench: 10.*
          # Laravel 11 uses Orchestra Testbench 9
          - laravel: 11.*
            testbench: 9.*
    name: PHP ${{ matrix.php }} / L${{ matrix.laravel }} / ${{ matrix.dependency-version }}

    # MariaDB service, using the same version as the Lando setup (.lando.dist.yml)
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: eclipse_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Override the Lando database settings from workbench/.env (copied from .env.example by the composer setup script)
    # and the SQLite defaults from phpunit.xml.dist, so the MariaDB service is used.
    # The root user is used, since parallel testing needs to create a database for each process.
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: eclipse_test
      DB_USERNAME: root
      DB_PASSWORD: root
      TELESCOPE_ENABLED: false

    steps:

      #- name: Configure operating system
      #  run: sudo apt-get update && sudo apt-get install -y locales locales-all

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ matrix.dependency-version }}-${{ hashFiles('**/composer.lock') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          # extensions: mbstring, gd, intl

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Setup testbench environment
        run: |
          composer setup
          sed -i 's/APP_ENV=local/APP_ENV=testing/' workbench/.env

      - name: Run test suite
        run: composer test -- --ci --parallel
